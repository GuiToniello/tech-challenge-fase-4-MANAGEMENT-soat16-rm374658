apiVersion: v1
kind: ConfigMap
metadata:
  name: management-api-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: management-api
    app.kubernetes.io/part-of: techchallenge-oficina
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  AllowedHosts: "*"
  Serilog__MinimumLevel__Default: "Information"
  Serilog__MinimumLevel__Override__Microsoft.AspNetCore: "Warning"
  SqsSettings__FilaConsumo: "techchallenge-oficina-management.fifo"
  SqsSettings__FilasPublicacao__0: "techchallenge-oficina-os-service.fifo"
  SqsSettings__FilasPublicacao__1: "techchallenge-oficina-billing.fifo"
  SqsSettings__FilasPublicacao__2: "techchallenge-oficina-execution.fifo"
  DynamoDbSettings__TabelaHistoricoEstoque: "techchallenge-oficina-management-estoque-historico"
  AWS_REGION: "us-east-1"
