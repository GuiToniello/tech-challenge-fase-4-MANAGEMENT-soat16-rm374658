apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: management-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: management-api
    app.kubernetes.io/part-of: techchallenge-oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: management-api
  minReplicas: 1
  # Máximo de 3 réplicas por API: 3 APIs × 3 + 10 pods de sistema = 19, dentro dos 22 pods que cabem nos 2 nodes t3.small
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
    # Memória em 150% do request (192Mi): com o tracer .NET do Datadog, o uso em repouso passa dos 80% (~102Mi) e o HPA escalaria sem carga
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 150
