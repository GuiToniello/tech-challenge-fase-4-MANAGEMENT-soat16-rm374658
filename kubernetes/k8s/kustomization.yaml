apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina

resources:
  - base/namespace.yml
  - features/management-api/configmap.yml
  - features/management-api/deployment.yml
  - features/management-api/hpa.yml
  - features/management-api/service.yml

secretGenerator:
  - name: oficina-api-secrets
    envs:
      - .env

generatorOptions:
  disableNameSuffixHash: true
