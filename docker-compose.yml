services:
  postgres:
    image: postgres:17-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P@ssw0rd123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sa} -d ${POSTGRES_DB:-oficina}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # SQS local (filas FIFO definidas em elasticmq.conf) para a troca de eventos com o OS Service, o Billing
  # e o Execução e Produção (os outros composes usam este ElasticMQ como broker compartilhado da saga local)
  elasticmq:
    image: docker.io/softwaremill/elasticmq-native:1.6.14
    container_name: oficina-elasticmq
    ports:
      - "${ELASTICMQ_PORT:-9324}:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    restart: unless-stopped

  management-api:
    image: ${REGISTRY_PREFIX:-}techchallenge-oficina-management:${IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: 1 - Frameworks & Drivers/TechChallenge.Oficina.Management.API/Dockerfile
    container_name: oficina-management-api
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      Serilog__MinimumLevel__Default: ${LOG_LEVEL_DEFAULT:-Information}
      Serilog__MinimumLevel__Override__Microsoft.AspNetCore: ${LOG_LEVEL_ASPNETCORE:-Warning}
      DatabaseSettings__ConnectionString: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=oficina;Username=sa;Password=P@ssw0rd123}
      ResendSettings__ApiKey: ${RESEND_API_KEY}
      SqsSettings__FilaConsumo: ${SQS_FILA_CONSUMO:-techchallenge-oficina-management.fifo}
      # Fan-out: o mesmo evento vai para as filas do OS Service, do Billing e do Execução e Produção, nesta ordem
      SqsSettings__FilasPublicacao__0: ${SQS_FILA_PUBLICACAO_OS_SERVICE:-techchallenge-oficina-os-service.fifo}
      SqsSettings__FilasPublicacao__1: ${SQS_FILA_PUBLICACAO_BILLING:-techchallenge-oficina-billing.fifo}
      SqsSettings__FilasPublicacao__2: ${SQS_FILA_PUBLICACAO_EXECUTION:-techchallenge-oficina-execution.fifo}
      SqsSettings__ServiceUrl: ${SQS_SERVICE_URL:-http://elasticmq:9324}
      # Credenciais ficticias para o ElasticMQ (nao valida assinatura); fixas para nunca herdar credenciais AWS reais do shell
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    ports:
      - "${API_MANAGEMENT_PORT:-7194}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
