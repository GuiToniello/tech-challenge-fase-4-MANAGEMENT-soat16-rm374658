name: Bootstrap
# Sobe o ambiente inteiro, na ordem: testes → VPC/EKS/API Gateway → addons → RDS → imagem no ECR → manifests.
# As filas SQS (com usuários IAM e chaves no SSM) sobem em paralelo, logo depois dos testes, e antes dos manifests.
# Use na primeira criação, para recriar depois do Destroy ou para reaplicar a HEAD da main.
# Depois dele, rode o Deploy do repo LAMBDA (as Lambdas usam a VPC e o RDS criados aqui) e o Bootstrap
# do repo OS-SERVICE (usa a VPC, o EKS, a rota /os do API Gateway e as filas SQS criados aqui).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Primeiro, para falhar antes de criar recursos pagos
  build-test:
    uses: ./.github/workflows/_build-test.yml

  terraform-foundation:
    needs: build-test
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: kubernetes/infra/foundation
      command: apply
    secrets: inherit

  # Não depende da VPC nem do EKS. O k8s-apply lê a chave da Management no SSM
  terraform-sqs:
    needs: build-test
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: SQS/infra
      command: apply
    secrets: inherit

  terraform-addons:
    needs: terraform-foundation
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: kubernetes/infra/addons
      command: apply
    secrets: inherit

  terraform-db:
    needs: terraform-addons
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: DB/infra
      command: apply
    secrets: inherit

  build-push:
    needs: terraform-db
    uses: ./.github/workflows/_build-push.yml
    with:
      image-tag: latest # os manifests em kubernetes/k8s usam :latest
    secrets: inherit

  k8s-apply:
    needs: [build-push, terraform-sqs]
    uses: ./.github/workflows/_k8s-apply.yml
    with:
      command: apply
      restart-pods: true
    secrets: inherit
