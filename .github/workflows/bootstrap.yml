name: Bootstrap
# Sobe o ambiente inteiro, na ordem: testes → VPC/EKS/API Gateway → addons → RDS e tabela DynamoDB do histórico de
# estoque (DB/infra) → imagem no ECR → manifests.
# As filas SQS (com usuários IAM e chaves no SSM dos 4 serviços, inclusive o Execução e Produção, e a política
# DynamoDB do usuário da Management) sobem em paralelo, logo depois dos testes, e antes dos manifests.
# Use na primeira criação, para recriar depois do Destroy ou para reaplicar a HEAD da main.
# Depois dele, rode os Bootstraps dos repos OS-SERVICE, BILLING e EXECUTION (usam a VPC, o EKS, as rotas /os, /billing
# e /execution do API Gateway e as filas SQS criados aqui): o OS-SERVICE antes do EXECUTION, porque o OS Service
# precisa consumir os eventos novos antes de o Execução e Produção publicá-los; o BILLING a qualquer momento depois
# deste. Por fim, o Deploy do repo LAMBDA (as Lambdas usam a VPC e o RDS criados aqui).
# Ordem entre os repos: este → OS-SERVICE → EXECUTION (BILLING a qualquer momento depois deste) → LAMBDA.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Primeiro, para falhar antes de criar recursos pagos
  build-test:
    uses: ./.github/workflows/_build-test.yml

  terraform-foundation:
    needs: build-test
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: kubernetes/infra/foundation
      command: apply
    secrets: inherit

  # Não depende da VPC nem do EKS. O k8s-apply lê a chave da Management no SSM. A política da tabela DynamoDB da
  # Management fica aqui, no mesmo state do usuário IAM, e não no terraform-db (os dois rodam em paralelo)
  terraform-sqs:
    needs: build-test
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: SQS/infra
      command: apply
    secrets: inherit

  terraform-addons:
    needs: terraform-foundation
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: kubernetes/infra/addons
      command: apply
    secrets: inherit

  # RDS e tabela DynamoDB do histórico de movimentações de estoque (a política da tabela vai no terraform-sqs)
  terraform-db:
    needs: terraform-addons
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: DB/infra
      command: apply
    secrets: inherit

  build-push:
    needs: terraform-db
    uses: ./.github/workflows/_build-push.yml
    with:
      image-tag: latest # os manifests em kubernetes/k8s usam :latest
    secrets: inherit

  k8s-apply:
    needs: [build-push, terraform-sqs]
    uses: ./.github/workflows/_k8s-apply.yml
    with:
      command: apply
      restart-pods: true
    secrets: inherit
