name: Destroy
# Destrutivo: exige confirmação por input e aprovação no Environment "destroy". Os dados do RDS e o histórico de
# movimentações de estoque na tabela DynamoDB são perdidos.
# Antes, rode o Destroy do repo LAMBDA (a Lambda buscar-cliente fica nas subnets privadas e tem uma regra no SG do RDS)
# e os dos repos OS-SERVICE, BILLING e EXECUTION (o RDS de cada um fica nas subnets privadas e o SG dele referencia o SG
# dos nodes). Os jobs *-check abaixo barram o Destroy enquanto algum deles estiver de pé.
# Ordem entre os repos: LAMBDA, OS-SERVICE, BILLING e EXECUTION (em qualquer ordem) → este.
# Ordem: RDS e tabela DynamoDB (DB/infra) → addons → foundation (EKS, API Gateway, NLB e VPC). O SQS (SQS/infra,
# com a política DynamoDB da Management) sai em paralelo.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy" para confirmar a remoção do RDS, da tabela DynamoDB, do EKS, dos addons, dos recursos do Datadog, das filas SQS e da VPC'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Falha visível em vez de um run "verde" que não destruiu nada
  reject:
    if: inputs.confirm != 'destroy' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Destroy não executado: informe confirm=destroy e rode a partir da branch main."
          exit 1

  # SG da Lambda buscar-cliente (repo LAMBDA): ela fica nas subnets privadas e impediria o destroy do RDS e da VPC.
  # O SG só some depois que a AWS libera as interfaces de rede da Lambda
  lambda-check:
    if: inputs.confirm == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar se as Lambdas do repo LAMBDA já foram destruídas
        run: |
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=techchallenge-oficina-lambda-sg --query 'length(SecurityGroups)' --output text)
          if [ "$sg" != "0" ]; then
            echo "::error::O SG techchallenge-oficina-lambda-sg (repo LAMBDA) ainda existe. Rode o Destroy do repo LAMBDA antes."
            exit 1
          fi

  # RDS e SG do repo OS-SERVICE: o RDS fica nas subnets privadas e o SG referencia o SG dos nodes,
  # o que impediria o destroy da VPC e do SG dos nodes
  os-service-check:
    if: inputs.confirm == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar se o RDS do repo OS-SERVICE já foi destruído
        run: |
          rds=$(aws rds describe-db-instances --query "length(DBInstances[?DBInstanceIdentifier=='techchallenge-oficina-os-postgres'])" --output text)
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=techchallenge-oficina-os-rds-sg --query 'length(SecurityGroups)' --output text)
          if [ "$rds" != "0" ] || [ "$sg" != "0" ]; then
            echo "::error::O RDS techchallenge-oficina-os-postgres ou o SG techchallenge-oficina-os-rds-sg (repo OS-SERVICE) ainda existe. Rode o Destroy do repo OS-SERVICE antes."
            exit 1
          fi

  # RDS e SG do repo BILLING: mesmo motivo do os-service-check (subnets privadas e SG que referencia o SG dos nodes)
  billing-check:
    if: inputs.confirm == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar se o RDS do repo BILLING já foi destruído
        run: |
          rds=$(aws rds describe-db-instances --query "length(DBInstances[?DBInstanceIdentifier=='techchallenge-oficina-billing-postgres'])" --output text)
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=techchallenge-oficina-billing-rds-sg --query 'length(SecurityGroups)' --output text)
          if [ "$rds" != "0" ] || [ "$sg" != "0" ]; then
            echo "::error::O RDS techchallenge-oficina-billing-postgres ou o SG techchallenge-oficina-billing-rds-sg (repo BILLING) ainda existe. Rode o Destroy do repo BILLING antes."
            exit 1
          fi

  # RDS e SG do repo EXECUTION: mesmo motivo do os-service-check (subnets privadas e SG que referencia o SG dos nodes)
  execution-check:
    if: inputs.confirm == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar se o RDS do repo EXECUTION já foi destruído
        run: |
          rds=$(aws rds describe-db-instances --query "length(DBInstances[?DBInstanceIdentifier=='techchallenge-oficina-execution-postgres'])" --output text)
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=techchallenge-oficina-execution-rds-sg --query 'length(SecurityGroups)' --output text)
          if [ "$rds" != "0" ] || [ "$sg" != "0" ]; then
            echo "::error::O RDS techchallenge-oficina-execution-postgres ou o SG techchallenge-oficina-execution-rds-sg (repo EXECUTION) ainda existe. Rode o Destroy do repo EXECUTION antes."
            exit 1
          fi

  gate:
    needs: [lambda-check, os-service-check, billing-check, execution-check]
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - run: echo "Destroy aprovado"

  # Filas SQS, usuários IAM (com as políticas sqs e, na Management, dynamodb-historico-estoque) e chaves no SSM:
  # não dependem da VPC nem do EKS
  terraform-destroy-sqs:
    needs: gate
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: SQS/infra
      command: destroy
    secrets: inherit

  # O RDS sai primeiro: ele usa as subnets privadas e o SG dos nodes, e o DB/infra lê a VPC pelo cluster EKS.
  # A tabela DynamoDB do histórico de estoque sai junto (o histórico é perdido)
  terraform-destroy-db:
    needs: gate
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: DB/infra
      command: destroy
    secrets: inherit

  terraform-destroy-addons:
    needs: terraform-destroy-db
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: kubernetes/infra/addons
      command: destroy
    secrets: inherit

  # Roda mesmo se o destroy dos addons falhar (ex.: chaves do Datadog revogadas ou trial vencido),
  # para o EKS nunca ficar ligado gerando custo. O run continua vermelho, então a falha fica visível.
  # Não roda se o destroy do RDS falhar (a VPC não sairia) nem se o dos addons for cancelado
  terraform-destroy-foundation:
    needs: [terraform-destroy-db, terraform-destroy-addons]
    if: ${{ !cancelled() && needs.terraform-destroy-db.result == 'success' && needs.terraform-destroy-addons.result != 'cancelled' }}
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: kubernetes/infra/foundation
      command: destroy
    secrets: inherit
