name: Destroy
# Destrutivo: exige confirmação por input e aprovação no Environment "destroy". Os dados do RDS são perdidos.
# Antes, rode o Destroy do repo LAMBDA: a Lambda buscar-cliente fica nas subnets privadas e tem uma regra no SG do RDS.
# Ordem: RDS (DB/infra) → addons → foundation (EKS, API Gateway, NLB e VPC).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy" para confirmar a remoção do RDS, do EKS, dos addons, dos recursos do Datadog e da VPC'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Falha visível em vez de um run "verde" que não destruiu nada
  reject:
    if: inputs.confirm != 'destroy' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Destroy não executado: informe confirm=destroy e rode a partir da branch main."
          exit 1

  # SG da Lambda buscar-cliente (repo LAMBDA): ela fica nas subnets privadas e impediria o destroy do RDS e da VPC.
  # O SG só some depois que a AWS libera as interfaces de rede da Lambda
  lambda-check:
    if: inputs.confirm == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar se as Lambdas do repo LAMBDA já foram destruídas
        run: |
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=techchallenge-oficina-lambda-sg --query 'length(SecurityGroups)' --output text)
          if [ "$sg" != "0" ]; then
            echo "::error::O SG techchallenge-oficina-lambda-sg (repo LAMBDA) ainda existe. Rode o Destroy do repo LAMBDA antes."
            exit 1
          fi

  gate:
    needs: lambda-check
    runs-on: ubuntu-latest
    environment: destroy
    steps:
      - run: echo "Destroy aprovado"

  # O RDS sai primeiro: ele usa as subnets privadas e o SG dos nodes, e o DB/infra lê a VPC pelo cluster EKS
  terraform-destroy-db:
    needs: gate
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: DB/infra
      command: destroy
    secrets: inherit

  terraform-destroy-addons:
    needs: terraform-destroy-db
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: kubernetes/infra/addons
      command: destroy
    secrets: inherit

  # Roda mesmo se o destroy dos addons falhar (ex.: chaves do Datadog revogadas ou trial vencido),
  # para o EKS nunca ficar ligado gerando custo. O run continua vermelho, então a falha fica visível.
  # Não roda se o destroy do RDS falhar (a VPC não sairia) nem se o dos addons for cancelado
  terraform-destroy-foundation:
    needs: [terraform-destroy-db, terraform-destroy-addons]
    if: ${{ !cancelled() && needs.terraform-destroy-db.result == 'success' && needs.terraform-destroy-addons.result != 'cancelled' }}
    uses: ./.github/workflows/_terraform.yml
    with:
      working-directory: kubernetes/infra/foundation
      command: destroy
    secrets: inherit
