# ElasticMQ (SQS local) para o docker-compose: cria as filas FIFO da coreografia entre Management, OS Service, Billing
# e Execucao e Producao (broker compartilhado da saga local entre os 4 composes).
# Na AWS as filas sao criadas pelo Terraform; aqui os nomes e o maxReceiveCount da DLQ seguem o mesmo contrato.
include classpath("application.conf")

# URL das filas montada com o host e a porta de cada requisicao: serve a API no container (http://elasticmq:9324),
# ferramentas no host (http://localhost:9324) e os servicos de outros composes (OS Service, Billing e Execucao e Producao)
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  # Consumida pelo Management (eventos publicados pelo OS Service e pelo Billing)
  "techchallenge-oficina-management.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "techchallenge-oficina-management-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-management-dlq.fifo" {
    fifo = true
  }

  # Consumida pelo OS Service (eventos publicados pelos demais servicos)
  "techchallenge-oficina-os-service.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "techchallenge-oficina-os-service-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-os-service-dlq.fifo" {
    fifo = true
  }

  # Consumida pelo Billing (eventos publicados pelo Management e pelo OS Service)
  "techchallenge-oficina-billing.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "techchallenge-oficina-billing-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-billing-dlq.fifo" {
    fifo = true
  }

  # Consumida pelo Execucao e Producao (eventos publicados pelo Management e pelo OS Service)
  "techchallenge-oficina-execution.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "techchallenge-oficina-execution-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-execution-dlq.fifo" {
    fifo = true
  }
}
