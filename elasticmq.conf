# ElasticMQ (SQS local) para o docker-compose: cria as filas FIFO da coreografia Management <-> OS Service.
# Na AWS as filas sao criadas pelo Terraform; aqui os nomes e o maxReceiveCount da DLQ seguem o mesmo contrato.
include classpath("application.conf")

# URL das filas montada com o host e a porta de cada requisicao: serve a API no container (http://elasticmq:9324),
# ferramentas no host (http://localhost:9324) e o OS Service de outro compose (http://host.containers.internal:9324)
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  # Consumida pelo Management (eventos publicados pelo OS Service)
  "techchallenge-oficina-management.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "techchallenge-oficina-management-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-management-dlq.fifo" {
    fifo = true
  }

  # Consumida pelo OS Service (eventos publicados pelo Management)
  "techchallenge-oficina-os-service.fifo" {
    fifo = true
    contentBasedDeduplication = false
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "techchallenge-oficina-os-service-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-os-service-dlq.fifo" {
    fifo = true
  }
}
